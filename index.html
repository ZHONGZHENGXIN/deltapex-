
<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Deltapex 自营交易 - ATAS订单流中文社区</title>
    <link rel="icon" type="image/png" href="https://via.placeholder.com/32x32?text=A" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#D32F2F",
              "primary-hover": "#B71C1C",
            },
            fontFamily: {
              sans: ["Inter", "Noto Sans SC", "sans-serif"],
              display: ["Noto Sans SC", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.375rem",
            },
            animation: {
              shimmer: "shimmer 4s linear infinite",
              "scroll-x": "scroll-x 40s linear infinite",
              "fade-in-up": "fadeInUp 0.5s ease-out forwards",
            },
            keyframes: {
              shimmer: {
                "0%": { backgroundPosition: "0% 50%" },
                "100%": { backgroundPosition: "200% 50%" },
              },
              "scroll-x": {
                "0%": { transform: "translateX(0)" },
                "100%": { transform: "translateX(-50%)" },
              },
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(10px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              }
            },
          },
        },
      };
    </script>
    <style>
      .hover-scale {
        transition: transform 0.2s ease-in-out;
      }
      .hover-scale:hover {
        transform: scale(1.05);
      }
      /* 隐藏滚动条 */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* 实现两侧淡入淡出遮罩 */
      .mask-fade-edges {
        mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
      }
    </style>
<script type="importmap">
{
  "imports": {
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3",
    "framer-motion": "https://esm.sh/framer-motion@^12.31.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "clsx": "https://esm.sh/clsx@^2.1.1",
    "tailwind-merge": "https://esm.sh/tailwind-merge@^3.4.0",
    "lenis": "https://esm.sh/lenis@^1.3.17"
  }
}
</script>
</head>
  <body class="bg-white text-slate-600 font-sans antialiased relative">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
