<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Deltapex 自营交易 - ATAS订单流中文社区</title>
    <link rel="icon" type="image/png" href="https://via.placeholder.com/32x32?text=A" />
    <!-- 保持使用 Tailwind CDN，方便快速部署 -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#D32F2F",
              "primary-hover": "#B71C1C",
            },
            fontFamily: {
              sans: ["Inter", "Noto Sans SC", "sans-serif"],
              display: ["Noto Sans SC", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.375rem",
            },
            animation: {
              shimmer: "shimmer 4s linear infinite",
            },
            keyframes: {
              shimmer: {
                "0%": { backgroundPosition: "0% 50%" },
                "100%": { backgroundPosition: "200% 50%" },
              },
            },
          },
        },
      };
    </script>
    <style>
      .hover-scale {
        transition: transform 0.2s ease-in-out;
      }
      .hover-scale:hover {
        transform: scale(1.05);
      }
    </style>
